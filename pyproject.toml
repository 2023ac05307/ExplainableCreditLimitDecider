[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "explainable-credit-limit-decider"
version = "0.1.0"
description = "Explainable Offline RL framework for dynamic credit limit actions (HOLD/CLI/CLD) with MLOps pipeline."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Aditya", email = "" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
  "scikit-learn>=1.4",
  "torch>=2.1",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "prometheus-client>=0.20",
  "pydantic>=2.6",
  "mlflow>=2.10",
  "boto3>=1.34",
  "python-dotenv>=1.0",
]

[tool.setuptools]
packages = ["src"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
